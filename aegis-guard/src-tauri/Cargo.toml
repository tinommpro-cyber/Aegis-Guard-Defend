[package]
name = "aegis-guard"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
aes-gcm = "0.10"
rand = "0.8"
walkdir = "2"
rayon = "1"
memchr = "2"
notify = "6"
sysinfo = "0.30"
dirs = "5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
